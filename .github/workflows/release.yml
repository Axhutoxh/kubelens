name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
          # Oldest supported Ubuntu keeps the glibc requirement low so the build runs on more distros
          - os: ubuntu-22.04
            name: linux
            args: --bundles deb,rpm,appimage
          # One universal build covers both Apple Silicon and Intel Macs
          - os: macos-latest
            name: macos
            args: --bundles dmg --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Same steps as scripts/build.bat: Tauri runs the frontend build, then packages the installers
      - name: Build Tauri app
        run: bun x @tauri-apps/cli@2 build ${{ matrix.args }}

      # Fixed file names so the website can link to releases/latest/download/<name>
      - name: Collect Windows artifacts
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/freelens-rust.exe release/kubellens.exe
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName release/kubellens-setup.exe

      - name: Collect Linux artifacts
        if: matrix.name == 'linux'
        run: |
          mkdir -p release
          cp target/release/bundle/deb/*.deb           release/kubellens-linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm           release/kubellens-linux-x86_64.rpm
          cp target/release/bundle/appimage/*.AppImage release/kubellens-linux-amd64.AppImage

      - name: Collect macOS artifacts
        if: matrix.name == 'macos'
        run: |
          mkdir -p release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg release/kubellens-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: kubellens-${{ matrix.name }}
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # Hand-written highlights first; GitHub's generated change list is appended below
          body_path: .github/release-notes.md
          generate_release_notes: true
