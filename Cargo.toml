[package]
name = "freelens-rust"
version = "1.3.0"
edition = "2021"
authors = ["Ashutosh Chandra"]
description = "Kubellens - native Kubernetes desktop IDE (Rust + Tauri v2)"

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
portable-pty = "0.9"
dirs = "6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
