[package]
name = "freelens-rust"
version = "0.1.0"
edition = "2021"
authors = ["Ashutosh Chandra"]
description = "lensbyacp - High-performance Kubernetes IDE backend"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

