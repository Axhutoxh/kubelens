[package]
name = "freelens-rust"
version = "1.5.0"
edition = "2021"
authors = ["Ashutosh Chandra"]
description = "Kubellens - native Kubernetes desktop IDE (Rust + Tauri v2)"

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
portable-pty = "0.9"
dirs = "6"
# AI assistant: HTTPS to Claude / Gemini with the OS certificate store (works behind corporate proxies)
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
regex = "1"

# API keys live in Windows Credential Manager / macOS Keychain (Linux uses a 0600 file)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
